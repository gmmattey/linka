<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Máscara de recorte do ícone (Squircle / Rounded Rectangle Apple) -->
    <clipPath id="icon-clip">
      <rect x="88" y="96" width="847" height="838" rx="216" ry="216" />
    </clipPath>

    <!-- Gradiente de fundo principal (Violeta luminoso a roxo profundo) -->
    <linearGradient id="bg-grad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#8124e7" />
      <stop offset="20%" stop-color="#7119db" />
      <stop offset="40%" stop-color="#580ebc" />
      <stop offset="60%" stop-color="#43069b" />
      <stop offset="80%" stop-color="#370489" />
      <stop offset="100%" stop-color="#360387" />
    </linearGradient>

    <!-- Iluminação ambiente suave no topo esquerdo -->
    <radialGradient id="tl-ambient" cx="15%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#9b3ef7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#8124e7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6d17dc" stop-opacity="0" />
    </radialGradient>

    <!-- Sombra suave no quadrante superior direito -->
    <linearGradient id="tr-shade" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#180033" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#220245" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#2b0254" stop-opacity="0.38" />
    </linearGradient>

    <!-- Reflexo curvo (Gloss / Brilho do vidro na crista do arco) -->
    <linearGradient id="arc-highlight" x1="15%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="25%" stop-color="#c294ff" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#b77aff" stop-opacity="0.55" />
      <stop offset="90%" stop-color="#9c3eff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8020e6" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente da onda suave inferior -->
    <linearGradient id="bottom-wave-grad" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#5a0fb8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#4f0ca9" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#43069b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b048f" stop-opacity="0" />
    </linearGradient>

    <!-- Brilho na borda inferior (Rim Light / Borda reflexiva) -->
    <linearGradient id="bottom-rim-grad" x1="50%" y1="100%" x2="50%" y2="86%">
      <stop offset="0%" stop-color="#7016cf" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#6312bd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4806a0" stop-opacity="0" />
    </linearGradient>

    <!-- Sombra diagonal projetada entre a letra L e o k -->
    <linearGradient id="diag-cast-shadow" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#13002b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#180036" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#220146" stop-opacity="0" />
    </linearGradient>

    <!-- Sombra projetada elegante das letras e do ponto (Drop Shadow de 2 camadas) -->
    <filter id="letter-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <!-- Sombra difusa e profunda -->
      <feDropShadow dx="2" dy="14" stdDeviation="11" flood-color="#110026" flood-opacity="0.55" />
      <!-- Sombra de oclusão de contato próxima -->
      <feDropShadow dx="1" dy="5" stdDeviation="3.5" flood-color="#0a001a" flood-opacity="0.4" />
    </filter>

    <!-- Filtro de suavização para a crista do arco brilhante -->
    <filter id="blur-edge">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Estrutura do ícone com fundo transparente ao redor -->
  <g clip-path="url(#icon-clip)">
    <!-- 1. Fundo com gradiente principal -->
    <rect x="88" y="96" width="847" height="838" fill="url(#bg-grad)" />

    <!-- 2. Luz ambiente no canto superior esquerdo -->
    <rect x="88" y="96" width="847" height="838" fill="url(#tl-ambient)" />

    <!-- 3. Área sombreada no quadrante superior direito delimitada pela curva -->
    <path d="M 780 110 C 720 310, 530 445, 330 540 L 935 540 L 935 96 L 780 96 Z" fill="url(#tr-shade)" />

    <!-- 4. Crista de reflexo de vidro (arco brilhante) -->
    <path d="M 780 110 C 720 310, 530 445, 330 540" stroke="url(#arc-highlight)" stroke-width="5" fill="none" filter="url(#blur-edge)" />

    <!-- 5. Sombra diagonal sutil entre L e k -->
    <path d="M 460 460 L 330 535 L 330 670 L 460 670 Z" fill="url(#diag-cast-shadow)" />

    <!-- 6. Onda orgânica suave na parte inferior -->
    <path d="M 370 934 C 522 791, 736 748, 935 715 L 935 934 Z" fill="url(#bottom-wave-grad)" />

    <!-- 7. Brilho na borda inferior do ícone -->
    <rect x="88" y="880" width="847" height="54" fill="url(#bottom-rim-grad)" />

    <!-- 8. Elementos tipográficos em vetor 1:1 e ponto com sombra suave -->
    <g filter="url(#letter-shadow)">
      <path d="M 266.50 332.30 c -6.90 2.30 -12.60 5.70 -17.8 10.50 -5.90 5.50 -9.10 10.40 -12.0 18.10 -2.20 5.60 -2.20 5.60 -1.8 123.60 0.30 128.80 0.30 130.30 6.1000000000000005 147.00 7.60 22.40 23.00 37.50 45.300000000000004 44.40 11.80 3.60 25.10 4.30 76.2 3.90 43.90 -0.40 48.40 -0.50 53.0 -2.30 10.80 -4.00 18.70 -11.10 23.700000000000003 -21.30 3.10 -6.30 3.30 -7.30 3.3000000000000003 -17.70 0.00 -10.20 -0.20 -11.50 -3.1 -17.50 -3.40 -7.20 -9.40 -13.80 -16.2 -17.70 -8.10 -4.80 -12.90 -5.30 -50.2 -5.30 -20.60 -0.00 -36.00 -0.40 -38.2 -1.00 -4.80 -1.40 -9.70 -5.50 -11.4 -9.70 -1.20 -2.70 -1.40 -22.30 -1.4000000000000001 -111.60 0.00 -105.90 0.00 -108.50 -2.0 -114.20 -4.30 -12.50 -12.20 -21.30 -23.700000000000003 -26.70 -5.60 -2.70 -8.00 -3.20 -16.2 -3.50 -6.20 -0.20 -11.00 0.20 -13.600000000000001 1.00 z" fill="#FFFFFF" />
      <path d="M 487.90 333.20 c -11.60 4.10 -20.90 13.60 -25.1 25.50 -2.30 6.80 -2.30 6.80 -2.0 145.30 0.20 76.20 0.70 141.10 1.2000000000000002 144.20 1.90 12.40 9.50 22.80 20.8 28.10 6.40 3.00 7.30 3.20 18.7 3.20 11.60 -0.00 12.30 -0.10 18.6 -3.20 12.20 -6.00 20.10 -17.20 21.8 -31.00 0.50 -3.90 0.70 -18.70 0.5 -32.90 -0.30 -14.20 -0.10 -26.50 0.4 -27.20 0.50 -0.70 1.50 -1.00 2.3000000000000003 -0.70 0.80 0.30 15.30 19.30 32.300000000000004 42.10 17.00 22.80 32.70 43.10 34.9 45.00 6.50 5.50 13.60 7.60 24.200000000000003 7.20 7.20 -0.30 10.20 -0.90 14.8 -3.00 18.50 -8.70 28.10 -30.70 21.700000000000003 -49.80 -3.00 -9.00 -3.80 -10.00 -32.4 -42.40 -28.10 -31.80 -30.60 -34.80 -30.6 -35.90 0.00 -0.70 17.00 -17.90 37.800000000000004 -38.40 42.90 -42.10 43.80 -43.30 44.900000000000006 -57.60 2.20 -28.60 -27.80 -49.00 -54.7 -37.20 -6.00 2.60 -9.70 6.00 -49.5 45.70 -23.70 23.50 -43.60 42.80 -44.300000000000004 42.80 -0.60 -0.00 -1.30 -0.80 -1.3 -1.80 -0.10 -0.90 0.00 -31.20 0.1 -67.20 0.20 -69.40 0.10 -70.30 -4.6000000000000005 -80.50 -3.30 -7.20 -11.60 -15.20 -19.400000000000002 -18.80 -9.10 -4.20 -21.50 -4.80 -31.1 -1.50 z" fill="#FFFFFF" />
      <circle cx="747.2" cy="624.5" r="55.7" fill="#bd88fc" />
    </g>
  </g>
</svg>