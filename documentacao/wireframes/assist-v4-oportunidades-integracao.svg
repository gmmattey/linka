<svg xmlns="http://www.w3.org/2000/svg" width="430" height="930" viewBox="0 0 430 930"><style>.t{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:#182638}.s{font-size:14px;fill:#657285}.h{font-size:26px;font-weight:700}.b{font-size:17px;font-weight:600}</style><rect width="430" height="930" rx="36" fill="#f8f9fc"/><text x="28" y="57" class="t s">9:41</text><text x="28" y="112" class="t h">Oportunidades</text><text x="28" y="140" class="t s">Melhorias baseadas nas suas medições</text><rect x="20" y="177" width="390" height="340" rx="22" fill="white" stroke="#e2e7ed"/><circle cx="54" cy="220" r="19" fill="#eef3ff"/><text x="45" y="227" font-size="21" fill="#2563eb">!</text><text x="83" y="216" class="t b">Conexão instável</text><text x="83" y="242" class="t s">Observado no último teste</text><text x="38" y="286" class="t" font-size="16">Foram observadas variações de latência.</text><text x="38" y="312" class="t s">Isso não confirma a origem do problema.</text><line x1="38" y1="337" x2="390" y2="337" stroke="#e2e7ed"/><text x="38" y="370" class="t s">Evidência</text><text x="38" y="396" class="t" font-size="16">Medição recente · detalhes disponíveis</text><rect x="38" y="431" width="354" height="58" rx="16" fill="#2563eb"/><text x="115" y="467" font-family="Arial" font-size="17" font-weight="600" fill="white">Investigar com Assist  →</text><rect x="20" y="541" width="390" height="130" rx="22" fill="white" stroke="#e2e7ed"/><text x="38" y="579" class="t b">Responsividade sob carga</text><text x="38" y="608" class="t s">Sua conexão pode sofrer com uso simultâneo.</text><text x="38" y="641" font-size="15" fill="#2563eb">Ver oportunidade  →</text><rect x="20" y="696" width="390" height="150" rx="22" fill="white" stroke="#e2e7ed"/><text x="38" y="732" class="t b">Ao abrir o Assist</text><text x="38" y="764" class="t s">“Encontrei sinais de instabilidade no teste.</text><text x="38" y="786" class="t s">Quer investigar onde isso acontece?”</text><text x="38" y="823" font-size="15" fill="#2563eb">Continuar investigação  →</text></svg>