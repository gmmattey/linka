<svg xmlns="http://www.w3.org/2000/svg" width="392" height="852" viewBox="0 0 392 852"><style>.head{font:700 22px -apple-system,BlinkMacSystemFont,Arial}.item{font:600 16px -apple-system,BlinkMacSystemFont,Arial}.sub{font:14px -apple-system,BlinkMacSystemFont,Arial;fill:#576475}.small{font:600 12px -apple-system,BlinkMacSystemFont,Arial;fill:#576475}</style><rect width="392" height="852" fill="white"/><text x="30" y="57" class="sub">9:41</text><text x="30" y="111" class="head">✦ Assist</text><text x="30" y="137" class="sub">Seu especialista em conexões</text><rect x="100" y="165" width="260" height="65" rx="16" fill="#f3f5f8"/><text x="119" y="191" class="sub">Posso usar meu roteador antigo</text><text x="119" y="212" class="sub">para melhorar o Wi-Fi?</text><text x="30" y="270" class="head">Pode ser uma alternativa.</text><text x="30" y="302" class="sub">Precisamos confirmar o modo AP e o cabo.</text><rect x="26" y="330" width="340" height="95" rx="16" fill="#f3f5f8"/><text x="45" y="359" class="item">Equipamento considerado</text><text x="45" y="386" class="sub">TP-Link Archer C6 · revisão a confirmar</text><text x="30" y="467" class="item">O que recomendo</text><text x="35" y="504" class="sub">1. Verificar conexão Ethernet</text><text x="35" y="534" class="sub">2. Confirmar suporte a modo AP</text><text x="30" y="580" class="item">▸ Dados usados na resposta</text><text x="30" y="635" class="item">Consegue passar cabo até o quarto?</text><text x="32" y="675" class="sub">◯ Sim     ◯ Não     ◯ Não sei</text><text x="30" y="726" class="sub">Copiar       Salvar</text><rect x="20" y="783" width="352" height="52" rx="24" fill="#f3f5f8"/><text x="40" y="815" class="sub">Pergunte sobre sua rede...</text><circle cx="344" cy="809" r="17" fill="#2563eb"/><text x="338" y="815" fill="white">↑</text></svg>
