name: LinkaApp
options:
  bundleIdPrefix: com.linka
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
  InternalBeta: release
settings:
  base:
    MARKETING_VERSION: "1.1.6"
    CURRENT_PROJECT_VERSION: "59"
    DEVELOPMENT_LANGUAGE: pt-BR
  configs:
    InternalBeta:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LINKA_INTERNAL_BETA"
targets:
  LinkaApp:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: 16.0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        # O deploymentTarget do XcodeGen não chegou ao alvo da aplicação no
        # projeto gerado. Fixar o valor aqui impede que o Xcode herde o SDK
        # instalado (26.5) como mínimo de instalação na App Store.
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        # A infraestrutura de publicidade fica presente, porém desligada até
        # a configuração de produção (política, consentimento e revisão) ser
        # explicitamente liberada. O código falha fechado quando esta flag não
        # for verdadeira.
        LINKA_ADS_ENABLED: NO
        CODE_SIGN_ENTITLEMENTS: LinkaApp/LinkaApp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2Z4T8228GR"
        PRODUCT_BUNDLE_IDENTIFIER: com.linka.assist
        # 1 = iPhone, 2 = iPad. Reabre iPad no build (decisão do Luiz,
        # 2026-09-16) depois do V1 iPhone-only de 2026-09-07 (012c63fd).
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          APS_ENVIRONMENT: development
          # O Debug não solicita inventário do AdMob. Os IDs de teste ficam
          # no código apenas para um smoke explícito, quando esta flag for
          # habilitada localmente num esquema que não é distribuído.
          LINKA_ADS_ENABLED: NO
        Release:
          APS_ENVIRONMENT: production
          LINKA_ADS_ENABLED: YES
        InternalBeta:
          APS_ENVIRONMENT: production
          LINKA_ADS_ENABLED: YES
    info:
      path: LinkaApp/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - pt-BR
          - en
          - es-419
        CFBundleURLTypes:
          - CFBundleURLName: com.linka.wifi-advanced
            CFBundleURLSchemes:
              - linka
        LSApplicationQueriesSchemes:
          - shortcuts
        NDAssistRelayEndpoint: "https://linka-assist-relay.buildealabs.workers.dev/v2/assist"
        LinkaServiceStatusEndpoint: "https://linka-assist-relay.buildealabs.workers.dev/v1/service-status"
        GADApplicationIdentifier: "ca-app-pub-5542349230926522~6717355071"
        LinkaAdsEnabled: "$(LINKA_ADS_ENABLED)"
        NSCameraUsageDescription: "Fotografe a etiqueta para preencher marca e modelo. A imagem é lida neste aparelho e não é enviada nem salva pelo Linka."
        NSLocationWhenInUseUsageDescription: "O Linka usa a localização apenas porque o iPhone exige essa autorização para informar o nome da rede Wi-Fi atual. Sua localização não é salva para identificar a rede."
        NSLocationTemporaryUsageDescriptionDictionary:
          WiFiIdentification: "O Linka precisa de precisão total apenas para obter o nome da rede Wi-Fi atual exigido pelo sistema."
        NSLocalNetworkUsageDescription: "O Linka consulta o roteador da rede local para identificar o equipamento e diagnosticar a qualidade da conexão Wi-Fi."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPhone continua só retrato (decisão preservada). iPad ganha as
        # quatro orientações — é o único jeito de a coluna adaptativa
        # (linkaAdaptiveContentWidth) fazer sentido em paisagem também.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Sem isso, iPadOS trata o Linka como app "regular" de Stage
        # Manager: abre em janela flutuante redimensionável, com o papel de
        # parede da Tela de Início visível ao redor — exatamente o efeito
        # que o Luiz rejeitou. Um app de medição de propósito único deve
        # sempre abrir em tela cheia, sem competir por espaço com outras
        # janelas (mesmo princípio de "medir vem primeiro" do AGENTS.md).
        # Efeito colateral aceito: o Linka também fica fora de Split
        # View/Slide Over no iPad — não dá para meia-tela com outro app.
        UIRequiresFullScreen: true
    sources:
      - path: LinkaApp/Sources
      - path: LinkaApp/Resources
        buildPhase: resources
    dependencies:
      - package: LinkaEngine
      - package: LinkaModules
      - package: NetworkConnectivityTriage
      - package: LinkaAppIntents
      - package: NetscopeEvidence
      - package: MeasurementHistoryCloudKit
      - package: LinkaWidgetShared
      - package: NetworkDiagnostics
      - package: NetworkOptimization
      - package: NetworkProfiles
      - package: NetworkInventory
      - package: NetworkDNSBenchmark
      - package: AssistConsultation
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - target: LinkaWidgetExtension
        embed: true
        codeSign: true
        platforms: [iOS]
  LinkaApp_macOS:
    type: application
    platform: macOS
    deploymentTarget:
      macOS: 13.0
    settings:
      base:
        MARKETING_VERSION: "1.1.5"
        CURRENT_PROJECT_VERSION: "54"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: LinkaApp/LinkaApp-macOS.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        DEVELOPMENT_TEAM: "2Z4T8228GR"
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.linka.assist
        PRODUCT_NAME: LinkaApp
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
        InternalBeta:
          APS_ENVIRONMENT: production
    info:
      path: LinkaApp/Info-macOS.plist
      properties:
        CFBundleLocalizations:
          - pt-BR
          - en
          - es-419
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.linka.wifi-advanced
            CFBundleURLSchemes:
              - linka
        LSApplicationQueriesSchemes:
          - shortcuts
        NDAssistRelayEndpoint: "https://linka-assist-relay.buildealabs.workers.dev/v2/assist"
        LinkaServiceStatusEndpoint: "https://linka-assist-relay.buildealabs.workers.dev/v1/service-status"
        NSLocalNetworkUsageDescription: "O Linka consulta o roteador da rede local para identificar o equipamento e diagnosticar a qualidade da conexão Wi-Fi."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    sources:
      - path: LinkaApp/Sources
        excludes:
          - UI/MainView.swift
      - path: LinkaApp/Resources
        buildPhase: resources
    dependencies:
      - package: LinkaEngine
      - package: LinkaModules
      - package: NetworkConnectivityTriage
      - package: LinkaAppIntents
      - package: NetscopeEvidence
      - package: MeasurementHistoryCloudKit
      - package: LinkaWidgetShared
      - package: NetworkDiagnostics
      - package: NetworkOptimization
      - package: NetworkProfiles
      - package: NetworkInventory
      - package: NetworkDNSBenchmark
  LinkaAppUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    deploymentTarget: 16.0
    dependencies:
      - target: LinkaApp
    sources:
      - path: ../store/app-store/screenshots/AppStoreScreenshotsUITests.swift
      - path: ../store/app-store/screenshots/MyNetworkUITests.swift

  LinkaAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 16.0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: LinkaApp/Tests
    dependencies:
      - target: LinkaApp
  LinkaWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: 17.0
    settings:
      base:
        # XcodeGen não propaga o mapa `deploymentTarget: { iOS: 17.0 }`
        # para este tipo de app extension no Xcode 27; sem a chave explícita,
        # o projeto herda o SDK instalado (27.0) e o archive fica inválido.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.linka.assist.Widget
        PRODUCT_NAME: LinkaWidget
        CODE_SIGN_ENTITLEMENTS: LinkaWidget/LinkaWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2Z4T8228GR"
    info:
      path: LinkaWidget/Info.plist
      properties:
        CFBundleDisplayName: Linka SpeedTest
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: LinkaWidget/Sources
      - path: LinkaApp/Sources/UI/DesignSystem.swift
      - path: LinkaWidget/Resources
        buildPhase: resources
    dependencies:
      - package: LinkaAppIntents
      - package: LinkaWidgetShared
  LinkaWidgetTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget:
      iOS: 17.0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: LinkaWidget/Tests
    dependencies:
      - target: LinkaWidgetExtension
      - package: LinkaWidgetShared
schemes:
  LinkaApp:
    build:
      targets:
        LinkaApp: all
        LinkaAppTests: [test]
        LinkaAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LinkaAppTests
        - LinkaAppUITests
    archive:
      config: Release
  LinkaApp-InternalBeta:
    build:
      targets:
        LinkaApp: all
    run:
      config: InternalBeta
    profile:
      config: InternalBeta
    archive:
      config: InternalBeta
  LinkaApp_macOS:
    build:
      targets:
        LinkaApp_macOS: all
    run:
      config: Debug
    archive:
      config: Release
  LinkaApp_macOS-InternalBeta:
    build:
      targets:
        LinkaApp_macOS: all
    run:
      config: InternalBeta
    profile:
      config: InternalBeta
    archive:
      config: InternalBeta
packages:
  NetworkInventory:
    path: NetworkInventory
  LinkaEngine:
    path: LinkaEngine
  LinkaModules:
    path: LinkaModules
  NetworkConnectivityTriage:
    path: NetworkConnectivityTriage
  LinkaAppIntents:
    path: LinkaAppIntents
  NetscopeEvidence:
    path: NetscopeEvidence
  MeasurementHistoryCloudKit:
    path: MeasurementHistoryCloudKit
  LinkaWidgetShared:
    path: LinkaWidgetShared
  NetworkDiagnostics:
    path: NetworkDiagnostics
  NetworkOptimization:
    path: NetworkOptimization
  NetworkProfiles:
    path: NetworkProfiles
  NetworkDNSBenchmark:
    path: NetworkDNSBenchmark
  AssistConsultation:
    path: AssistConsultation
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
