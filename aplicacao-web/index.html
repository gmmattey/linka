<!doctype html>
<html lang="pt-BR" data-theme="light">

    <meta charset="UTF-8" />
    <!-- Favicon multi-formato: ICO p/ legacy + PNGs para Chrome/Firefox. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Meça sua internet e acompanhe o histórico. O Linka+ ajuda a entender resultados e dados de rede disponíveis." />

    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Linka — Speedtest e Assist para iPhone" />
    <meta property="og:description" content="Meça, acompanhe e entenda sua internet. iPhone, iPad e Mac." />
    <meta property="og:image" content="/prototype/brand/icons/AppIcon-iOS.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Linka — Speedtest e Assist para iPhone" />
    <meta name="twitter:description" content="Meça, acompanhe e entenda sua internet. iPhone, iPad e Mac." />
    <meta name="twitter:image" content="/prototype/brand/icons/AppIcon-iOS.png" />

    <title>Linka — Speedtest e Assist para iPhone</title>

    <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>

  </body>
